[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rotalog-backend"
version = "0.1.0"
description = "API backend do RotaLog"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi[standard]>=0.115,<1.0",
    "pydantic>=2,<3",
    "SQLAlchemy>=2,<2.1",
    "uvicorn[standard]>=0.30,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rotalog"]

