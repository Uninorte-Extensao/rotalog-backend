name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Python 3.13
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Obter código-fonte
        uses: actions/checkout@v4

      - name: Configurar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Baixar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validar compilação
        run: python -m compileall -q src

      - name: Validar importação da aplicação
        run: python -c "from rotalog.api.main import app; assert app.title == 'RotaLog API'"

      - name: Executar testes
        if: ${{ hashFiles('tests/**/*.py') != '' }}
        run: |
          python -m pip install pytest
          python -m pytest
