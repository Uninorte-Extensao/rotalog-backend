name: PR Checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Lint, build e testes
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Obter código-fonte
        uses: actions/checkout@v4

      - name: Configurar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff pytest

      - name: Lint
        run: ruff check src

      - name: Build
        run: python -m compileall -q src

      - name: Validar importação da aplicação
        run: PYTHONPATH=src python -c "from rotalog.api.main import app; assert app.title == 'RotaLog API'"

      - name: Testes
        run: |
          if find tests -type f -name 'test_*.py' -o -name '*_test.py' 2>/dev/null | grep -q .; then
            python -m pytest
          else
            echo "Nenhum teste Python encontrado; etapa concluída sem testes para executar."
          fi
