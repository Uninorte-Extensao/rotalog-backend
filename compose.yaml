name: rotalog-demo
services:
  db:
    image: postgis/postgis:17-3.5-alpine
    environment:
      POSTGRES_USER: rotalog
      POSTGRES_DB: rotalog_demo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U rotalog -d rotalog_demo"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    build: .
    environment: &api_environment
      ROTALOG_DATABASE_URL: postgresql+psycopg://rotalog:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}@db:5432/rotalog_demo
      ROTALOG_ENVIRONMENT: ${ROTALOG_ENVIRONMENT:-development}
      ROTALOG_DEBUG: "false"
      ROTALOG_DEMO_ENABLED: ${ROTALOG_DEMO_ENABLED:-false}
      ROTALOG_DATA_CONTEXT_ID: ${ROTALOG_DATA_CONTEXT_ID:-}
      ROTALOG_JWT_SECRET: ${ROTALOG_JWT_SECRET:?Defina ROTALOG_JWT_SECRET}
      ROTALOG_DEMO_PASSWORD: ${ROTALOG_DEMO_PASSWORD:-}
      ROTALOG_CORS_ORIGINS: ${ROTALOG_CORS_ORIGINS:-[]}
      ROTALOG_COOKIE_SECURE: ${ROTALOG_COOKIE_SECURE:-false}
      ROTALOG_COOKIE_SAMESITE: ${ROTALOG_COOKIE_SAMESITE:-lax}
      ROTALOG_PRODUCT_IMAGES_ROOT: /var/lib/rotalog/product-images
      ROTALOG_PRODUCT_IMAGES_PER_PRODUCT: ${ROTALOG_PRODUCT_IMAGES_PER_PRODUCT:-5}
      ROTALOG_PRODUCT_IMAGE_MAX_BYTES: ${ROTALOG_PRODUCT_IMAGE_MAX_BYTES:-8388608}
      ROTALOG_PRODUCT_IMAGE_MAX_PIXELS: ${ROTALOG_PRODUCT_IMAGE_MAX_PIXELS:-16000000}
      ROTALOG_PRODUCT_IMAGE_UPLOAD_TTL_SECONDS: ${ROTALOG_PRODUCT_IMAGE_UPLOAD_TTL_SECONDS:-900}
      ROTALOG_TRACKING_STALE_SECONDS: ${ROTALOG_TRACKING_STALE_SECONDS:-120}
      ROTALOG_TRACKING_SYNC_WINDOW_SECONDS: ${ROTALOG_TRACKING_SYNC_WINDOW_SECONDS:-86400}
      ROTALOG_TRACKING_ACCURACY_WARNING_METERS: ${ROTALOG_TRACKING_ACCURACY_WARNING_METERS:-100}
      ROTALOG_TRACKING_BATCHES_PER_MINUTE: ${ROTALOG_TRACKING_BATCHES_PER_MINUTE:-20}
    volumes:
      - product_images:/var/lib/rotalog/product-images
    command: [sh, -c, "python -m rotalog.operations.startup && exec uvicorn rotalog.api.main:app --host 0.0.0.0 --port 8000 --proxy-headers"]
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 30s
    restart: unless-stopped
  worker:
    build: .
    environment: *api_environment
    volumes:
      - product_images:/var/lib/rotalog/product-images
    command: [python, -m, rotalog.demo.worker]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
  product_images:
